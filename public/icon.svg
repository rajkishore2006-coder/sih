<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#7C2D12" />
    </radialGradient>
    <linearGradient id="onionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>
  </defs>

  <!-- Background Circle with Safe Margin -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Onion Bulb Shape -->
  <g transform="translate(256, 290)">
    <!-- Main Outer Bulb -->
    <path d="M 0 -130 C 90 -70 140 20 120 100 C 100 160 30 180 0 180 C -30 180 -100 160 -120 100 C -140 20 -90 -70 0 -130 Z" fill="url(#onionGrad)" />
    <!-- Inner Texture Contours -->
    <path d="M 0 -110 C 60 -50 90 20 75 80 C 60 130 15 150 0 150 C -15 150 -60 130 -75 80 C -90 20 -60 -50 0 -110 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="6" />
    <path d="M 0 -90 C 35 -30 50 20 40 60 C 30 95 10 120 0 120 C -10 120 -30 95 -40 60 C -50 20 -35 -30 0 -90 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="5" />
    <!-- Root base -->
    <path d="M -15 180 Q 0 195 15 180" stroke="#78350F" stroke-width="6" stroke-linecap="round" fill="none" />
  </g>

  <!-- Green Sprout Shoots -->
  <g transform="translate(256, 160)">
    <path d="M 0 0 C 25 -40 50 -70 30 -110 C 15 -75 5 -40 0 0 Z" fill="url(#sproutGrad)" />
    <path d="M 0 0 C -25 -40 -50 -70 -30 -110 C -15 -75 -5 -40 0 0 Z" fill="url(#sproutGrad)" />
    <path d="M 0 0 C 0 -50 10 -90 0 -130 C -10 -90 0 -50 0 0 Z" fill="url(#sproutGrad)" />
  </g>

  <!-- AI / Digital Quality Sparkle Indicator -->
  <g transform="translate(380, 130)">
    <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24 Z" fill="#FDE047" />
  </g>
</svg>
